name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: stacklight
          POSTGRES_PASSWORD: stacklight
          POSTGRES_DB: stacklight
        ports: ["15432:5432"]
        options: >-
          --health-cmd "pg_isready -U stacklight -d stacklight"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["16379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # The defaults in backend/app/config.py already point at these ports.
      DATABASE_URL: postgresql://stacklight:stacklight@127.0.0.1:15432/stacklight
      REDIS_URL: redis://127.0.0.1:16379/0
      AUTO_SEED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend (CPU-only torch)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev]"
      - name: "Test (default suite, no slow model tests or browser e2e)"
        working-directory: backend
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
