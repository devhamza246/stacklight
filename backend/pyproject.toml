[project]
name = "stacklight"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "litellm>=1.50",
  "sentence-transformers>=3.0",
  "celery[redis]>=5.4",
  "beautifulsoup4>=4.12",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx2"]
e2e = ["playwright>=1.50"]  # then: playwright install chromium

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "slow: loads real models (deselected by default; run with -m slow)",
  "e2e: browser tests against the real app with stubbed LLM (deselected by default; run with `make e2e`)",
]
addopts = "-m 'not slow and not e2e'"
